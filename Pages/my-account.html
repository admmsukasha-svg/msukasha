<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | MSukasha</title>
  <link rel="icon" type="image/png" href="../Favicon/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
  <style>
    .account-layout{display:grid;grid-template-columns:240px 1fr;gap:24px;padding-bottom:60px;}
    .account-nav{background:#fff;border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;height:fit-content;}
    .account-nav-header{padding:20px;background:var(--dark);color:#fff;display:flex;align-items:center;gap:12px;}
    .user-avatar{width:44px;height:44px;background:var(--orange);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;}
    .account-nav a{display:flex;align-items:center;gap:10px;padding:12px 20px;font-size:13px;color:var(--text);border-bottom:1px solid #f5f5f5;transition:all var(--transition);}
    .account-nav a:hover,.account-nav a.active{background:var(--orange-light);color:var(--orange);}
    .account-nav a i{width:16px;color:var(--muted);}
    .account-nav a:hover i,.account-nav a.active i{color:var(--orange);}
    .order-item{display:flex;align-items:center;gap:14px;padding:14px;border-bottom:1px solid #f5f5f5;}
    .order-img{width:56px;height:56px;background:#f0f2f5;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#ccc;flex-shrink:0;}
    @media(max-width:768px){.account-layout{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<header class="site-header" id="site-header"></header>
<div class="page-header"><div class="container"><h1>My Account</h1><div class="breadcrumb"><a href="../index.html">Home</a><span>/</span><span>My Account</span></div></div></div>
<main><div class="container" style="padding-top:36px;">
  <div class="account-layout">
    <div class="account-nav">
      <div class="account-nav-header">
        <div class="user-avatar" id="user-avatar">A</div>
        <div><p id="account-user-name" style="font-weight:700;font-size:14px;">Your Name</p><p id="account-user-email" style="font-size:11px;opacity:0.7;"></p></div>
      </div>
      <a href="my-account.html" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a href="track-order.html"><i class="fas fa-box"></i> My Orders</a>
      <a href="wishlist.html"><i class="far fa-heart"></i> Wishlist</a>
      <a href="messages.html"><i class="fas fa-envelope"></i> Messages</a>
      <a href="seller-dashboard.html"><i class="fas fa-store"></i> My Listings</a>
      <a href="#"><i class="fas fa-user-cog"></i> Profile Settings</a>
      <a href="#" onclick="handleSignOut(event)"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
    </div>
    <div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;">
        <div class="card" style="padding:20px;text-align:center;"><span id="stat-orders" style="font-size:28px;font-weight:800;color:var(--orange);display:block;">0</span><span style="font-size:12px;color:var(--muted);">Active Orders</span></div>
        <div class="card" style="padding:20px;text-align:center;"><span id="stat-wishlist" style="font-size:28px;font-weight:800;color:var(--orange);display:block;">0</span><span style="font-size:12px;color:var(--muted);">Wishlist Items</span></div>
        <div class="card" style="padding:20px;text-align:center;"><span id="stat-messages" style="font-size:28px;font-weight:800;color:var(--orange);display:block;">0</span><span style="font-size:12px;color:var(--muted);">Messages</span></div>
      </div>
      <div class="card">
        <div class="card-header"><h3>Recent Orders</h3></div>
        <div id="orders-container" style="min-height:120px;padding:16px;"></div>
      </div>
    </div>
  </div>
</div></main>
<footer class="site-footer" id="site-footer"></footer>
<script src="../main.js"></script>
<script src="../api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const user = getUser();
  if (!getToken()) {
    window.location.href = 'login.html';
    return;
  }

  if (!user) {
    const freshUser = await apiGetMe();
    if (!freshUser) {
      window.location.href = 'login.html';
      return;
    }
    fillAccount(freshUser);
    return;
  }

  fillAccount(user);
});

function fillAccount(user) {
  const avatar = document.getElementById('user-avatar');
  const nameEl = document.getElementById('account-user-name');
  const emailEl = document.getElementById('account-user-email');
  const ordersEl = document.getElementById('stat-orders');
  const wishlistEl = document.getElementById('stat-wishlist');
  const messagesEl = document.getElementById('stat-messages');
  const ordersContainer = document.getElementById('orders-container');

  avatar.textContent = user.firstName ? user.firstName[0].toUpperCase() : (user.email ? user.email[0].toUpperCase() : 'U');
  nameEl.textContent = `${user.firstName || ''} ${user.lastName || ''}`.trim() || 'Your Name';
  emailEl.textContent = user.email || '';
  ordersEl.textContent = (user.orders || []).length;
  wishlistEl.textContent = (user.wishlist || []).length;
  messagesEl.textContent = (user.messages || []).length;

  if (!user.orders || user.orders.length === 0) {
    ordersContainer.innerHTML = '<p style="color:var(--muted);font-size:13px;">No orders yet. Your profile will update after your first activity.</p>';
    return;
  }

  ordersContainer.innerHTML = '';
  user.orders.forEach(order => {
    const orderItem = document.createElement('div');
    orderItem.className = 'order-item';
    orderItem.innerHTML = `
      <div class="order-img"><i class="fas fa-box"></i></div>
      <div style="flex:1;"><p style="font-weight:600;font-size:13px;">${order.title || 'Order Item'}</p><p style="font-size:12px;color:var(--muted);">Order #${order.id || 'N/A'} &bull; ${order.date || ''}</p></div>
      <span class="badge badge-gray">${order.status || 'Pending'}</span>
    `;
    ordersContainer.appendChild(orderItem);
  });
}

function handleSignOut(e) {
  e.preventDefault();
  apiLogout();
  window.location.href = 'login.html';
}
</script>
</body></html>
