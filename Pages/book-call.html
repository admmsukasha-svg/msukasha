<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Free Call | msukasha</title>
<meta name="description" content="Book a free call with the msukasha team">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="../index.html">Home</a><i class="fas fa-chevron-right"></i><span>Book a Call</span></div>
      <h1>Book a Free Call</h1>
      <p>Talk to the msukasha team about sourcing, selling or advertising on the platform.</p>
      
    </div>
  </section>

  <div class="container" style="padding:32px 24px 60px;">
    <div class="two-col">
      <div class="card form-card">
        <h2 style="margin:0 0 18px;font-size:19px;">Request a Call</h2>
        <form id="call-form" onsubmit="msHandleLeadForm(event, 'Call request', 'call-result')">
          <div class="form-grid">
            <div class="form-group"><label data-label="Name">Name *</label><input name="name" required></div>
            <div class="form-group"><label data-label="Phone / WhatsApp">Phone / WhatsApp *</label><input type="tel" name="phone" required></div>
            <div class="form-group"><label data-label="Preferred date">Preferred date</label><input type="date" name="date"></div>
            <div class="form-group"><label data-label="Preferred time">Preferred time</label><input type="time" name="time"></div>
            <div class="form-group full"><label data-label="What would you like to discuss?">What would you like to discuss?</label><textarea name="topic" rows="4"></textarea></div>
          </div>
          <button type="submit" class="btn-primary" style="margin-top:18px;"><i class="fas fa-phone"></i> Request Call</button>
        </form>
        <div class="lead-result" id="call-result"></div>
      </div>
      <div class="info-card card">
        <h3><i class="fas fa-headset" style="color:var(--orange);margin-right:8px;"></i>What to expect</h3>
        <div class="info-row"><i class="fas fa-clock"></i><div><span>Call length</span><strong>Around 15 minutes</strong></div></div>
        <div class="info-row"><i class="fas fa-calendar-check"></i><div><span>Confirmation</span><strong>Sent by WhatsApp or email</strong></div></div>
        <div class="info-row"><i class="fas fa-comment-dots"></i><div><span>Prefer to message?</span><strong><a href="https://wa.me/923313730953" target="_blank" rel="noopener">WhatsApp us directly</a></strong></div></div>
      </div>
    </div>
  </div>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="../main.js"></script>
<script src="../api.js"></script>
</body>
</html>
