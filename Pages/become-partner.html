<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Become a Partner | msukasha</title>
<meta name="description" content="Partner with msukasha">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="../index.html">Home</a><i class="fas fa-chevron-right"></i><span>Partnership</span></div>
      <h1>Become a msukasha Partner</h1>
      <p>Partner with msukasha as a logistics provider, payment partner or affiliate.</p>
      
    </div>
  </section>

  <div class="container" style="padding:32px 24px 60px;">
    <div class="two-col">
      <div class="card form-card">
        <h2 style="margin:0 0 18px;font-size:19px;">Partnership Enquiry</h2>
        <form id="partner-form" onsubmit="msHandleLeadForm(event, 'Partnership enquiry', 'partner-result')">
          <div class="form-grid">
            <div class="form-group"><label data-label="Company name">Company name *</label><input name="company" required></div>
            <div class="form-group"><label data-label="Contact person">Contact person *</label><input name="contact" required></div>
            <div class="form-group"><label data-label="Email">Email *</label><input type="email" name="email" required></div>
            <div class="form-group"><label data-label="Phone / WhatsApp">Phone / WhatsApp *</label><input type="tel" name="phone" required></div>
            <div class="form-group full"><label data-label="Partnership type">Partnership type</label>
              <select name="type"><option>Logistics</option><option>Payments</option><option>Affiliate / Referral</option><option>Other</option></select>
            </div>
            <div class="form-group full"><label data-label="Message">Tell us about your business</label><textarea name="message" rows="4"></textarea></div>
          </div>
          <button type="submit" class="btn-primary" style="margin-top:18px;"><i class="fas fa-handshake"></i> Send Enquiry</button>
        </form>
        <div class="lead-result" id="partner-result"></div>
      </div>
      <div class="info-card card">
        <h3><i class="fas fa-star" style="color:var(--orange);margin-right:8px;"></i>Why partner with us</h3>
        <div class="info-row"><i class="fas fa-users"></i><div><span>Reach</span><strong>1.2M+ registered users</strong></div></div>
        <div class="info-row"><i class="fas fa-map-marker-alt"></i><div><span>Coverage</span><strong>100+ cities in Pakistan</strong></div></div>
        <div class="info-row"><i class="fas fa-headset"></i><div><span>Support</span><strong>Dedicated partner support</strong></div></div>
      </div>
    </div>
  </div>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="../main.js"></script>
<script src="../api.js"></script>
</body>
</html>
