<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | msukasha</title>
<meta name="description" content="Contact the msukasha team">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="../index.html">Home</a><i class="fas fa-chevron-right"></i><span>Contact</span></div>
      <h1>Contact Us</h1>
      <p>Get in touch with the msukasha team — we usually reply within one business day.</p>
      
    </div>
  </section>

  <div class="container" style="padding:32px 24px 60px;">
    <div class="two-col">
      <div class="card form-card">
        <h2 style="margin:0 0 18px;font-size:19px;">Send a Message</h2>
        <form id="contact-form" onsubmit="msHandleLeadForm(event, 'Contact form message', 'contact-result')">
          <div class="form-grid">
            <div class="form-group"><label data-label="Name">Name *</label><input name="name" required></div>
            <div class="form-group"><label data-label="Email">Email *</label><input type="email" name="email" required></div>
            <div class="form-group full"><label data-label="Subject">Subject *</label><input name="subject" required></div>
            <div class="form-group full"><label data-label="Message">Message *</label><textarea name="message" rows="5" required></textarea></div>
          </div>
          <button type="submit" class="btn-primary" style="margin-top:18px;"><i class="fas fa-paper-plane"></i> Send Message</button>
        </form>
        <div class="lead-result" id="contact-result"></div>
      </div>
      <div class="info-card card">
        <h3><i class="fas fa-address-book" style="color:var(--orange);margin-right:8px;"></i>Contact Details</h3>
        <div class="info-row"><i class="fas fa-envelope"></i><div><span>Email</span><strong>info@msukasha.com</strong></div></div>
        <div class="info-row"><i class="fab fa-whatsapp"></i><div><span>WhatsApp</span><strong>+92 331 3730953</strong></div></div>
        <div class="info-row"><i class="fas fa-map-marker-alt"></i><div><span>Location</span><strong>Pakistan</strong></div></div>
        <div class="info-row"><i class="fas fa-clock"></i><div><span>Response time</span><strong>Within 1 business day</strong></div></div>
      </div>
    </div>
  </div>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="../main.js"></script>
<script src="../api.js"></script>
</body>
</html>
