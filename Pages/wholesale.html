<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wholesale B2B | msukasha</title>
<meta name="description" content="Bulk pricing, minimum order quantities and verified suppliers, sourced across Pakistan.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="../index.html">Home</a><i class="fas fa-chevron-right"></i><span>Wholesale (B2B)</span></div>
      <h1>Wholesale B2B</h1>
      <p>Bulk pricing, minimum order quantities and verified suppliers, sourced across Pakistan.</p>
      
    </div>
  </section>

  <div class="container" style="padding:32px 24px 60px;">
    <div class="catalog-layout">
      <aside class="filter-card card">
        <h3><i class="fas fa-sliders-h"></i> Filters</h3>
        <div class="form-group">
          <label for="f-search">Search</label>
          <input id="f-search" type="text" placeholder="Search listings...">
        </div>
        <div class="form-group">
          <label for="f-cat">Category</label>
          <select id="f-cat"></select>
        </div>
        <input type="hidden" id="f-type" value="b2b">
        <div class="form-group">
          <label for="f-sort">Sort by</label>
          <select id="f-sort">
            <option value="">Relevance</option>
            <option value="name">Name (A–Z)</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
          </select>
        </div>
      </aside>
      <div>
        <div class="catalog-toolbar">
          <p id="catalog-count">Loading listings…</p>
        </div>
        <div class="product-grid catalog-grid" id="catalog-grid"></div>
      </div>
    </div>
  </div>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="../main.js"></script>
<script src="../api.js"></script>
<script>document.addEventListener("DOMContentLoaded",function(){msRenderCatalog({type:"b2b"});});</script>
</body>
</html>
