<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order | msukasha</title>
<meta name="description" content="Track your msukasha wholesale order">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="../index.html">Home</a><i class="fas fa-chevron-right"></i><span>Track Order</span></div>
      <h1>Track Your Order</h1>
      <p>Enter your order reference to check the current status of a wholesale order.</p>
      
    </div>
  </section>

  <div class="container" style="padding:32px 24px 60px;">
    <div class="narrow" style="padding:0;max-width:640px;">
      <div class="card form-card">
        <form id="track-form">
          <div class="form-group"><label for="t-id">Order reference</label><input id="t-id" placeholder="e.g. MS-2026-00184" required></div>
          <div class="form-group"><label for="t-email">Email used at checkout</label><input id="t-email" type="email" placeholder="you@example.com" required></div>
          <button type="submit" class="btn-primary" style="width:100%;justify-content:center;"><i class="fas fa-search"></i> Track Order</button>
        </form>
        <div id="track-result" style="margin-top:20px;"></div>
      </div>
    </div>
  </div>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="../main.js"></script>
<script src="../api.js"></script>
<script>
document.getElementById('track-form').addEventListener('submit', function(e){
  e.preventDefault();
  document.getElementById('track-result').innerHTML =
    '<div class="callout"><strong>Order tracking is coming soon.</strong> Once the backend order system is connected, live status for order <strong>'+escHtml(document.getElementById('t-id').value)+'</strong> will appear here. In the meantime, message us on <a href="https://wa.me/923313730953" target="_blank" rel="noopener">WhatsApp</a> with your order reference.</div>';
});
</script>
</body>
</html>
