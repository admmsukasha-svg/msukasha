<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Verification | msukasha</title>
<meta name="description" content="Apply for a verified supplier badge on msukasha">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="../index.html">Home</a><i class="fas fa-chevron-right"></i><span>Verification</span></div>
      <h1>Start Supplier Verification</h1>
      <p>Verified suppliers get a trust badge and higher visibility across msukasha.</p>
      
    </div>
  </section>

  <div class="container" style="padding:32px 24px 60px;">
    <div class="two-col">
      <div class="card form-card">
        <h2 style="margin:0 0 18px;font-size:19px;">Verification Request</h2>
        <form id="verify-form" onsubmit="msHandleLeadForm(event, 'Supplier verification request', 'verify-result')">
          <div class="form-grid">
            <div class="form-group"><label data-label="Business name">Business name *</label><input name="business" required></div>
            <div class="form-group"><label data-label="Contact person">Contact person *</label><input name="contact" required></div>
            <div class="form-group"><label data-label="Email">Email *</label><input type="email" name="email" required></div>
            <div class="form-group"><label data-label="Phone / WhatsApp">Phone / WhatsApp *</label><input type="tel" name="phone" required></div>
            <div class="form-group full"><label data-label="Business category">Business category</label><input name="category" placeholder="e.g. Electronics wholesaler"></div>
            <div class="form-group full"><label data-label="Registration / tax number">Registration or tax number</label><input name="regnum" placeholder="Optional"></div>
          </div>
          <button type="submit" class="btn-primary" style="margin-top:18px;"><i class="fas fa-paper-plane"></i> Submit for Verification</button>
        </form>
        <div class="lead-result" id="verify-result"></div>
      </div>
      <div class="info-card card">
        <h3><i class="fas fa-list-check" style="color:var(--orange);margin-right:8px;"></i>What you'll need</h3>
        <div class="info-row"><i class="fas fa-id-card"></i><div><span>Business documents</span><strong>Registration or tax certificate</strong></div></div>
        <div class="info-row"><i class="fas fa-store"></i><div><span>Business details</span><strong>Name, category and location</strong></div></div>
        <div class="info-row"><i class="fas fa-clock"></i><div><span>Review time</span><strong>Typically 2–3 business days</strong></div></div>
      </div>
    </div>
  </div>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="../main.js"></script>
<script src="../api.js"></script>
</body>
</html>
