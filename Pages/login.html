<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MSukasha</title>
  <link rel="icon" type="image/png" href="../Favicon/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
  <style>
    .auth-page{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 0;}
    .auth-box{background:#fff;border-radius:14px;border:1px solid var(--border);padding:36px 32px;max-width:920px;width:100%;box-shadow:var(--shadow-md);}
    .auth-logo{text-align:center;margin-bottom:24px;}
    .auth-logo img{height:44px;margin:0 auto 10px;}
    .auth-title{font-size:24px;font-weight:800;text-align:center;margin-bottom:8px;}
    .auth-sub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:24px;}
    .auth-tabs{display:flex;gap:6px;margin-bottom:24px;justify-content:center;}
    .auth-tabs .tab{flex:1;padding:12px 16px;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:#fafafa;color:var(--text-2);font-weight:700;transition:all .2s;}
    .auth-tabs .tab.active{background:var(--orange);color:#fff;border-color:var(--orange);}
    .auth-body{display:grid;gap:24px;}
    .signup-switch{display:flex;gap:12px;margin-bottom:20px;justify-content:center;}
    .account-type-btn{flex:1;padding:14px 12px;border:1.5px solid var(--border);border-radius:12px;background:#f8f8f8;color:var(--text-2);font-weight:700;cursor:pointer;transition:all var(--transition);}
    .account-type-btn.selected{border-color:var(--orange);background:var(--orange-subtle);color:var(--orange);}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .form-group{margin-bottom:18px;}
    .form-label{display:block;font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:8px;}
    .form-control{width:100%;padding:12px 14px;font-size:14px;border:1.5px solid var(--border);border-radius:10px;background:#fafafa;outline:none;transition:all var(--transition);}
    .form-control:focus{border-color:var(--orange);background:#fff;}
    .checkbox-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:18px;}
    .checkbox-row input{accent-color:var(--orange);}
    .signup-note{text-align:center;font-size:13px;color:var(--muted);margin-top:16px;}
    .signup-note a{color:var(--orange);font-weight:700;text-decoration:none;}
    .seller-only{display:none;}
    @media (max-width:700px){.form-grid{grid-template-columns:1fr;} .auth-box{padding:28px 20px;}}
  </style>
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <img src="../Logo/logo.png" alt="MSukasha" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span style="display:none;font-size:24px;font-weight:900;color:var(--orange);">MSukasha</span>
    </div>
    <div class="auth-tabs">
      <button id="tab-buyer" class="tab active" type="button" onclick="setActiveTab('buyer')">Buyer Login</button>
      <button id="tab-seller" class="tab" type="button" onclick="setActiveTab('seller')">Seller Login</button>
    </div>
    <p class="auth-sub" id="auth-subtext">Login as a buyer or seller to continue.</p>

    <section id="login-section">
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label"><i class="fas fa-envelope" style="color:var(--muted);margin-right:5px;"></i> Email Address *</label>
          <input type="email" class="form-control" id="login-email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" style="display:flex;justify-content:space-between;align-items:center;">
            <span><i class="fas fa-lock" style="color:var(--muted);margin-right:5px;"></i> Password *</span>
            <a href="#" style="font-size:12px;color:var(--orange);" onclick="forgotPwd(event)">Forgot password?</a>
          </label>
          <div style="position:relative;">
            <input type="password" class="form-control" id="login-password" placeholder="Enter your password" required style="padding-right:44px;">
            <button type="button" onclick="togglePwd()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;" id="pwd-toggle">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        <label class="checkbox-row">
          <input type="checkbox"> Remember me
        </label>
        <button type="submit" class="btn-primary submit-btn" id="login-btn">
          <i class="fas fa-sign-in-alt"></i> <span id="login-btn-text">Sign In</span>
        </button>
        <div class="signup-note" style="text-align:center;margin-top:16px;">
          Don't have an account? <a href="register.html">Create one here</a>
        </div>
      </form>
    </section>
  </div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="../main.js"></script>
<script src="../api.js"></script>
<script>
  let selectedLoginType = 'buyer';

  document.addEventListener("DOMContentLoaded", () => {
    if (getToken() && getUser()) {
      window.location.href = "my-account.html";
      return;
    }
    setActiveTab('buyer');
  });

  function setActiveTab(tab) {
    selectedLoginType = tab;
    document.getElementById('tab-buyer').classList.toggle('active', tab === 'buyer');
    document.getElementById('tab-seller').classList.toggle('active', tab === 'seller');
    document.getElementById('auth-subtext').textContent = tab === 'buyer'
      ? 'Login as a buyer to continue.'
      : 'Login as a seller to access your dashboard.';
  }

  function togglePwd() {
    const inp = document.getElementById("login-password");
    const btn = document.getElementById("pwd-toggle");
    inp.type = inp.type === "password" ? "text" : "password";
    btn.innerHTML = inp.type === "password" ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email    = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    const btn      = document.getElementById("login-btn");
    const btnText  = document.getElementById("login-btn-text");

    if (!email || !password) { showToast("Please fill all fields.", "warning"); return; }

    btn.disabled = true;
    btnText.textContent = "Signing in...";
    btn.querySelector("i").className = "fas fa-spinner fa-spin";

    try {
      await apiLogin(email, password);
      showToast("Login successful! Redirecting...", "success");
      setTimeout(() => {
        window.location.href = selectedLoginType === 'seller' ? 'seller-dashboard.html' : 'my-account.html';
      }, 1200);
    } catch (err) {
      showToast(err.message || "Login failed. Please try again.", "error");
      btn.disabled = false;
      btnText.textContent = "Sign In";
      btn.querySelector("i").className = "fas fa-sign-in-alt";
    }
  }

  function forgotPwd(e) {
    e.preventDefault();
    const email = document.getElementById("login-email").value.trim();
    if (!email) { showToast("Enter your email first.", "warning"); return; }
    showToast("Password reset link sent to " + email, "success");
  }
</script>
</body>
</html>
