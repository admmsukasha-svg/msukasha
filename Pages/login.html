<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | msukasha</title>
<meta name="description" content="Sign in to your msukasha account">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
  <div class="narrow" style="max-width:460px;">
    <div class="card form-card">
      <div style="text-align:center;margin-bottom:22px;">
        <h1 style="font-size:24px;margin:0 0 6px;">Sign in to msukasha</h1>
        <p style="color:var(--muted);font-size:13.5px;margin:0;">Access your cart, wishlist and seller tools.</p>
      </div>
      <form id="login-form">
        <div class="form-group"><label for="l-name">Full name</label><input id="l-name" name="name" type="text" placeholder="Your name" required></div>
        <div class="form-group"><label for="l-email">Email address</label><input id="l-email" name="email" type="email" placeholder="you@example.com" required></div>
        <div class="form-group"><label for="l-pass">Password</label><input id="l-pass" name="password" type="password" placeholder="••••••••" required></div>
        <button type="submit" class="btn-primary" style="width:100%;justify-content:center;">
          <i class="fas fa-right-to-bracket"></i> Sign In
        </button>
        <p style="text-align:center;font-size:12.5px;color:var(--muted);margin-top:14px;">
          Account sign-in will connect to the msukasha backend once it is live. For now this saves your details locally on this device.
        </p>
      </form>
    </div>
  </div>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="../main.js"></script>
<script src="../api.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', function(e){
  e.preventDefault();
  if (!validateForm(this)) return;
  setUser({ name: document.getElementById('l-name').value.trim(), email: document.getElementById('l-email').value.trim() });
  updateAuthButton();
  showToast('Signed in — welcome back!', 'success');
  setTimeout(function(){ window.location.href = './my-account.html'; }, 700);
});
</script>
</body>
</html>
