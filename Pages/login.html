<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MSukasha</title>
  <link rel="icon" type="image/png" href="../Favicon/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
  <style>
    .auth-page{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 0;}
    .auth-box{background:#fff;border-radius:14px;border:1px solid var(--border);padding:40px;width:100%;max-width:440px;box-shadow:var(--shadow-md);}
    .auth-logo{text-align:center;margin-bottom:28px;}
    .auth-logo img{height:44px;margin:0 auto 10px;}
    .auth-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:6px;}
    .auth-sub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:28px;}
    .divider{display:flex;align-items:center;gap:12px;margin:22px 0;}
    .divider hr{flex:1;border:none;border-top:1px solid var(--border);}
    .divider span{font-size:12px;color:var(--muted);white-space:nowrap;}
    .submit-btn{width:100%;justify-content:center;padding:13px;font-size:15px;border:none;cursor:pointer;display:flex;align-items:center;gap:8px;}
    .submit-btn:disabled{opacity:.6;cursor:not-allowed;}
  </style>
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <img src="../Logo/logo.png" alt="MSukasha" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span style="display:none;font-size:24px;font-weight:900;color:var(--orange);">MSukasha</span>
    </div>
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-sub">Sign in to your MSukasha account</p>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label"><i class="fas fa-envelope" style="color:var(--muted);margin-right:5px;"></i> Email Address *</label>
        <input type="email" class="form-control" id="login-email" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label" style="display:flex;justify-content:space-between;align-items:center;">
          <span><i class="fas fa-lock" style="color:var(--muted);margin-right:5px;"></i> Password *</span>
          <a href="#" style="font-size:12px;color:var(--orange);" onclick="forgotPwd(event)">Forgot password?</a>
        </label>
        <div style="position:relative;">
          <input type="password" class="form-control" id="login-password" placeholder="Enter your password" required style="padding-right:44px;">
          <button type="button" onclick="togglePwd()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;" id="pwd-toggle">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:20px;cursor:pointer;">
        <input type="checkbox" style="accent-color:var(--orange);"> Remember me
      </label>
      <button type="submit" class="btn-primary submit-btn" id="login-btn">
        <i class="fas fa-sign-in-alt"></i> <span id="login-btn-text">Sign In</span>
      </button>
    </form>

    <div class="divider"><hr><span>or</span><hr></div>
    <p style="text-align:center;font-size:13px;color:var(--muted);">
      Don't have an account? <a href="register.html" style="color:var(--orange);font-weight:700;">Create Account</a>
    </p>
  </div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="../main.js"></script>
<script src="../api.js"></script>
<script>
  // Redirect if already logged in
  document.addEventListener("DOMContentLoaded", () => {
    if (getToken() && getUser()) window.location.href = "my-account.html";
  });

  function togglePwd() {
    const inp = document.getElementById("login-password");
    const btn = document.getElementById("pwd-toggle");
    inp.type = inp.type === "password" ? "text" : "password";
    btn.innerHTML = inp.type === "password" ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email    = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    const btn      = document.getElementById("login-btn");
    const btnText  = document.getElementById("login-btn-text");

    if (!email || !password) { showToast("Please fill all fields.", "warning"); return; }

    // Loading state
    btn.disabled = true;
    btnText.textContent = "Signing in...";
    btn.querySelector("i").className = "fas fa-spinner fa-spin";

    try {
      await apiLogin(email, password);
      showToast("Login successful! Redirecting...", "success");
      setTimeout(() => window.location.href = "my-account.html", 1200);
    } catch (err) {
      showToast(err.message || "Login failed. Please try again.", "error");
      btn.disabled = false;
      btnText.textContent = "Sign In";
      btn.querySelector("i").className = "fas fa-sign-in-alt";
    }
  }

  function forgotPwd(e) {
    e.preventDefault();
    const email = document.getElementById("login-email").value.trim();
    if (!email) { showToast("Enter your email first.", "warning"); return; }
    showToast("Password reset link sent to " + email, "success");
  }
</script>
</body>
</html>
