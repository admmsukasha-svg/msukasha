<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | msukasha</title>
  <meta name="description" content="Sign in to your msukasha account">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4770382986050782" crossorigin="anonymous"></script>
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main>
    <div class="narrow" style="max-width:460px;">
      <div class="card form-card">
        <div style="text-align:center;margin-bottom:22px;">
          <h1 id="auth-title" style="font-size:24px;margin:0 0 6px;">Sign in to msukasha</h1>
          <p id="auth-description" style="color:var(--muted);font-size:13.5px;margin:0;">Sign in to continue to your account.</p>
        </div>
        <form id="login-form">
          <div class="form-group"><label for="l-email">Email address</label><input id="l-email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required></div>
          <div class="form-group"><label for="l-pass">Password</label><input id="l-pass" name="password" type="password" autocomplete="current-password" maxlength="128" required></div>
          <button type="submit" class="btn-primary" style="width:100%;justify-content:center;"><i class="fas fa-right-to-bracket"></i> Sign In</button>
        </form>
        <form id="register-form" hidden>
          <div class="form-group"><label for="r-name">Full name</label><input id="r-name" name="name" type="text" autocomplete="name" maxlength="120" placeholder="Your name" required></div>
          <div class="form-group"><label for="r-account-type">Account type</label><select id="r-account-type" name="accountType"><option value="buyer">Buyer account</option><option value="seller">Seller account</option></select></div>
          <div class="form-group" id="r-company-group" hidden><label for="r-company">Store / business name</label><input id="r-company" name="companyName" maxlength="160" placeholder="Your store name"></div>
          <div class="form-group" id="r-city-group" hidden><label for="r-city">Store city</label><input id="r-city" name="city" maxlength="80" placeholder="e.g. Lahore"></div>
          <div class="form-group"><label for="r-email">Email address</label><input id="r-email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required></div>
          <div class="form-group"><label for="r-pass">Password</label><input id="r-pass" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="At least 8 characters" required></div>
          <div class="form-group"><label for="r-confirm-pass">Confirm password</label><input id="r-confirm-pass" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div>
          <button type="submit" class="btn-primary" style="width:100%;justify-content:center;"><i class="fas fa-user-plus"></i> Create Account</button>
        </form>
        <p id="auth-message" role="status" aria-live="polite" style="margin:14px 0 0;font-size:13px;"></p>
        <p style="text-align:center;font-size:13px;margin:16px 0 0;">
          <button type="button" id="auth-toggle" class="see-all" style="border:0;background:none;cursor:pointer;">New to msukasha? Create an account</button>
        </p>
      </div>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>

  <script src="../main.js"></script>
  <script src="../api.js"></script>
  <script>
  (function () {
    const registerForm = document.getElementById('register-form');
    const loginForm = document.getElementById('login-form');
    const title = document.getElementById('auth-title');
    const description = document.getElementById('auth-description');
    const message = document.getElementById('auth-message');
    const toggle = document.getElementById('auth-toggle');
    const accountType = document.getElementById('r-account-type');
    const companyGroup = document.getElementById('r-company-group');
    const cityGroup = document.getElementById('r-city-group');
    const params = new URLSearchParams(window.location.search);
    const next = params.get('next');
    if (params.get('accountType') === 'seller' || next === 'seller-dashboard.html') accountType.value = 'seller';

    const returnTo = next === 'payment.html'
      ? './payment.html'
      : next === 'messages.html'
        ? './messages.html?' + ['recipientId', 'recipientName', 'productName']
          .filter((key) => params.has(key))
          .map((key) => encodeURIComponent(key) + '=' + encodeURIComponent(params.get(key)))
          .join('&')
        : next === 'seller-dashboard.html'
          ? './seller-dashboard.html'
          : './my-account.html';

    let pendingAdEmail = '';
    let registering = params.get('mode') === 'register';
    try {
      const pending = JSON.parse(sessionStorage.getItem('msukasha_pending_ad_payment') || 'null');
      if (pending && pending.email) {
        pendingAdEmail = String(pending.email).trim().toLowerCase();
        document.getElementById('r-email').value = pendingAdEmail;
        document.getElementById('l-email').value = pendingAdEmail;
      }
    } catch (error) {
      console.warn('Could not restore the pending advertisement email.', error);
    }

    function showMessage(text, isError) {
      message.textContent = text;
      message.style.color = isError ? '#c62828' : '#16803a';
    }

    function matchesPendingAdEmail(email) {
      if (!pendingAdEmail || String(email).trim().toLowerCase() === pendingAdEmail) return true;
      showMessage('Sign in or register with the same email address used for this advertisement.', true);
      return false;
    }

    // Older versions kept accounts only in this browser. If the matching email
    // and password are found locally, create that account on the backend once.
    async function migrateLegacyAccount(email, password) {
      let localUsers = [];
      try {
        localUsers = JSON.parse(localStorage.getItem('msukasha_users') || '[]');
        if (!Array.isArray(localUsers)) localUsers = [];
      } catch (_) {
        localUsers = [];
      }
      const normalizedEmail = email.trim().toLowerCase();
      const legacyUser = localUsers.find((user) =>
        user && String(user.email || '').trim().toLowerCase() === normalizedEmail && user.password === password
      );
      if (!legacyUser) return false;

      try {
        await apiRegister({
          name: legacyUser.name || [legacyUser.firstName, legacyUser.lastName].filter(Boolean).join(' ') || email,
          email: normalizedEmail,
          password,
          accountType: legacyUser.accountType || legacyUser.role || 'buyer',
          companyName: legacyUser.companyName || '',
          city: legacyUser.city || '',
          phone: legacyUser.phone || ''
        });
        return true;
      } catch (migrationError) {
        // If a server account already exists, preserve the original login error.
        console.warn('Legacy account migration was not completed.', migrationError);
        return false;
      }
    }

    function setMode(isRegistering) {
      registering = isRegistering;
      registerForm.hidden = !registering;
      loginForm.hidden = registering;
      title.textContent = registering ? 'Create your msukasha account' : 'Sign in to msukasha';
      description.textContent = registering
        ? 'Register to continue and manage your advertisements.'
        : 'Sign in to continue to your account.';
      toggle.textContent = registering ? 'Already have an account? Sign in' : 'New to msukasha? Create an account';
      showMessage('', false);
    }

    function updateSellerFields() {
      const isSeller = accountType.value === 'seller';
      companyGroup.hidden = !isSeller;
      cityGroup.hidden = !isSeller;
    }

    accountType.addEventListener('change', updateSellerFields);
    toggle.addEventListener('click', function () { setMode(!registering); });

    loginForm.addEventListener('submit', async function (event) {
      event.preventDefault();
      if (!loginForm.reportValidity()) return;
      const email = document.getElementById('l-email').value.trim();
      const password = document.getElementById('l-pass').value;
      if (!matchesPendingAdEmail(email)) return;
      const button = loginForm.querySelector('button[type="submit"]');
      button.disabled = true;
      showMessage('Signing in...', false);
      try {
        try {
          await apiLogin(email, password);
        } catch (loginError) {
          const isInvalidCredentials = /incorrect email or password/i.test(loginError.message || '');
          if (!isInvalidCredentials || !(await migrateLegacyAccount(email, password))) throw loginError;
        }
        window.location.href = returnTo;
      } catch (error) {
        showMessage(error.message || 'Could not sign in. Please check your details and try again.', true);
        button.disabled = false;
      }
    });

    registerForm.addEventListener('submit', async function (event) {
      event.preventDefault();
      if (!registerForm.reportValidity()) return;
      const email = document.getElementById('r-email').value.trim();
      if (!matchesPendingAdEmail(email)) return;
      const password = document.getElementById('r-pass').value;
      if (password !== document.getElementById('r-confirm-pass').value) {
        showMessage('Passwords do not match.', true);
        return;
      }
      const button = registerForm.querySelector('button[type="submit"]');
      button.disabled = true;
      showMessage('Creating your account...', false);
      try {
        await apiRegister({
          name: document.getElementById('r-name').value.trim(),
          email,
          password,
          accountType: accountType.value,
          companyName: document.getElementById('r-company').value.trim(),
          city: document.getElementById('r-city').value.trim()
        });
        window.location.href = returnTo;
      } catch (error) {
        showMessage(error.message || 'Could not create your account. Please try again.', true);
        button.disabled = false;
      }
    });

    updateSellerFields();
    setMode(registering);
  })();
  </script>
</body>
</html>
