<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist | MSukasha</title>
  <link rel="icon" type="image/png" href="Favicon/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<div class="page-header"><div class="container"><h1>My Wishlist</h1><div class="breadcrumb"><a href="index.html">Home</a><span>/</span><span>Wishlist</span></div></div></div>
<main><div class="container" style="padding:36px 0 60px;">
  <div id="wishlist-content">
    <div class="product-grid">
      <div class="product-card">
        <div class="card-img"><i class="fas fa-mobile-alt placeholder-icon"></i><span class="card-badge badge-used">USED</span></div>
        <div class="card-body"><p class="card-name">Used iPhone 12 Pro 128GB</p><p class="card-price" style="color:var(--dark);">Rs. 135,000</p><p class="card-location"><i class="fas fa-map-marker-alt"></i> DHA, Karachi</p></div>
        <div class="card-footer"><a href="cart.html" class="card-btn solid">Add to Cart</a><button onclick="this.closest('.product-card').remove();showToast('Removed from wishlist','info');" style="flex:1;padding:8px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid #fecaca;background:#fef2f2;color:#dc2626;cursor:pointer;">Remove</button></div>
      </div>
      <div class="product-card">
        <div class="card-img"><i class="fas fa-solar-panel placeholder-icon"></i><span class="card-badge badge-b2b">B2B</span></div>
        <div class="card-body"><p class="card-name">Industrial Solar Panels 545W</p><p class="card-price">$120.00/pc</p><p class="card-moq">MOQ: 10 Pieces</p></div>
        <div class="card-footer"><a href="cart.html" class="card-btn solid">Add to Cart</a><button onclick="this.closest('.product-card').remove();showToast('Removed from wishlist','info');" style="flex:1;padding:8px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid #fecaca;background:#fef2f2;color:#dc2626;cursor:pointer;">Remove</button></div>
      </div>
    </div>
  </div>
</div></main>
<footer class="site-footer" id="site-footer"></footer>
<script src="main.js"></script>
</body></html>
