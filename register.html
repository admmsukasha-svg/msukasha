<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | MSukasha</title>
  <link rel="icon" type="image/png" href="Favicon/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 0;}
    .auth-box{background:#fff;border-radius:14px;border:1px solid var(--border);padding:40px;width:100%;max-width:480px;box-shadow:var(--shadow-md);}
    .auth-logo{text-align:center;margin-bottom:24px;}
    .auth-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:6px;}
    .auth-sub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:24px;}
    .role-select{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
    .role-card{border:2px solid var(--border);border-radius:10px;padding:14px;text-align:center;cursor:pointer;transition:all .2s;}
    .role-card.active{border-color:var(--orange);background:var(--orange-light);}
    .role-card i{font-size:22px;color:var(--muted);display:block;margin-bottom:6px;}
    .role-card.active i{color:var(--orange);}
    .role-card p{font-size:13px;font-weight:700;margin-bottom:2px;}
    .role-card small{font-size:11px;color:var(--muted);}
    .submit-btn{width:100%;justify-content:center;padding:13px;font-size:15px;border:none;cursor:pointer;display:flex;align-items:center;gap:8px;}
    .submit-btn:disabled{opacity:.6;cursor:not-allowed;}
  </style>
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <img src="Logo/logo.png" alt="MSukasha" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span style="display:none;font-size:24px;font-weight:900;color:var(--orange);">MSukasha</span>
    </div>
    <h1 class="auth-title">Create Your Account</h1>
    <p class="auth-sub">Join 1.2 million traders on Pakistan's #1 marketplace</p>

    <p style="font-size:13px;font-weight:700;margin-bottom:10px;">I want to:</p>
    <div class="role-select">
      <div class="role-card active" id="role-buyer" onclick="selectRole('buyer')">
        <i class="fas fa-shopping-bag"></i>
        <p>Buy / Source</p>
        <small>Find wholesale or used items</small>
      </div>
      <div class="role-card" id="role-seller" onclick="selectRole('seller')">
        <i class="fas fa-store"></i>
        <p>Sell / Supply</p>
        <small>List products or ads</small>
      </div>
    </div>
    <input type="hidden" id="selected-role" value="buyer">

    <form id="register-form" onsubmit="handleRegister(event)">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div class="form-group">
          <label class="form-label">First Name *</label>
          <input type="text" class="form-control" id="reg-fname" placeholder="Ali" required>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name *</label>
          <input type="text" class="form-control" id="reg-lname" placeholder="Khan" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address *</label>
        <input type="email" class="form-control" id="reg-email" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Phone / WhatsApp *</label>
        <input type="tel" class="form-control" id="reg-phone" placeholder="+92 300 0000000" required>
      </div>
      <div class="form-group">
        <label class="form-label">City *</label>
        <select class="form-control" id="reg-city" required>
          <option value="">Select your city</option>
          <option>Karachi</option><option>Lahore</option><option>Islamabad</option>
          <option>Rawalpindi</option><option>Faisalabad</option><option>Multan</option>
          <option>Peshawar</option><option>Quetta</option><option>Sialkot</option>
          <option>Gujranwala</option><option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Password *</label>
        <div style="position:relative;">
          <input type="password" class="form-control" id="reg-password" placeholder="Minimum 6 characters" required style="padding-right:44px;">
          <button type="button" onclick="togglePwd('reg-password',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password *</label>
        <input type="password" class="form-control" id="reg-confirm" placeholder="Repeat your password" required>
      </div>
      <label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;margin-bottom:22px;cursor:pointer;line-height:1.5;">
        <input type="checkbox" id="reg-terms" style="accent-color:var(--orange);margin-top:2px;" required>
        I agree to MSukasha's <a href="terms-and-conditions.html" style="color:var(--orange);" target="_blank">Terms &amp; Conditions</a>
      </label>
      <button type="submit" class="btn-primary submit-btn" id="reg-btn">
        <i class="fas fa-user-plus"></i> <span id="reg-btn-text">Create Account</span>
      </button>
    </form>

    <p style="text-align:center;font-size:13px;color:var(--muted);margin-top:20px;">
      Already have an account? <a href="login.html" style="color:var(--orange);font-weight:700;">Sign In</a>
    </p>
  </div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="main.js"></script>
<script src="api.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (getToken() && getUser()) window.location.href = "my-account.html";
  });

  function selectRole(role) {
    document.getElementById("selected-role").value = role;
    document.getElementById("role-buyer").classList.toggle("active", role === "buyer");
    document.getElementById("role-seller").classList.toggle("active", role === "seller");
  }

  function togglePwd(id, btn) {
    const inp = document.getElementById(id);
    inp.type = inp.type === "password" ? "text" : "password";
    btn.innerHTML = inp.type === "password" ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
  }

  async function handleRegister(e) {
    e.preventDefault();
    const fname    = document.getElementById("reg-fname").value.trim();
    const lname    = document.getElementById("reg-lname").value.trim();
    const email    = document.getElementById("reg-email").value.trim();
    const phone    = document.getElementById("reg-phone").value.trim();
    const city     = document.getElementById("reg-city").value;
    const password = document.getElementById("reg-password").value;
    const confirm  = document.getElementById("reg-confirm").value;
    const role     = document.getElementById("selected-role").value;
    const terms    = document.getElementById("reg-terms").checked;

    if (!fname||!lname||!email||!phone||!city||!password) { showToast("Please fill all required fields.","warning"); return; }
    if (password.length < 6)  { showToast("Password must be at least 6 characters.","error"); return; }
    if (password !== confirm) { showToast("Passwords do not match!","error"); return; }
    if (!terms) { showToast("Please accept the Terms & Conditions.","error"); return; }

    const btn     = document.getElementById("reg-btn");
    const btnText = document.getElementById("reg-btn-text");
    btn.disabled  = true;
    btnText.textContent = "Creating account...";
    btn.querySelector("i").className = "fas fa-spinner fa-spin";

    try {
      await apiRegister({ name: fname + " " + lname, email, password, phone, city, role });
      showToast("Account created! Welcome to MSukasha!", "success");
      setTimeout(() => window.location.href = "my-account.html", 1200);
    } catch (err) {
      showToast(err.message || "Registration failed. Please try again.", "error");
      btn.disabled = false;
      btnText.textContent = "Create Account";
      btn.querySelector("i").className = "fas fa-user-plus";
    }
  }
</script>
</body>
</html>
