<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Application | MSukasha</title>

<link rel="icon" type="image/png" href="Favicon/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
    --orange:#ff6600;
    --dark:#1a2332;
    --border:#e5e7eb;
    --muted:#6b7280;
    --radius:14px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f8fafc;
    color:#111827;
}

.container{
    width:90%;
    max-width:900px;
    margin:auto;
}

.hero{
    background:linear-gradient(135deg,#1a2332,#2d4a6e);
    color:#fff;
    text-align:center;
    padding:70px 20px;
}

.hero h1{
    font-size:40px;
    margin-bottom:15px;
}

.hero p{
    opacity:.9;
    max-width:650px;
    margin:auto;
}

.application-card{
    background:#fff;
    margin-top:-40px;
    margin-bottom:60px;
    padding:35px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:700;
}

input,
select,
textarea{
    width:100%;
    padding:14px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:14px;
}

textarea{
    resize:vertical;
    min-height:120px;
}

input:focus,
textarea:focus,
select:focus{
    outline:none;
    border-color:var(--orange);
}

.btn{
    background:var(--orange);
    color:#fff;
    border:none;
    padding:14px 28px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
    font-size:15px;
}

.btn:hover{
    opacity:.9;
}

.role-box{
    background:#fff7ed;
    border:1px solid #fed7aa;
    padding:15px;
    border-radius:10px;
    margin-bottom:25px;
}

.success-message{
    display:none;
    background:#dcfce7;
    color:#166534;
    padding:16px;
    border-radius:10px;
    margin-top:20px;
}

footer{
    text-align:center;
    padding:30px;
    color:var(--muted);
}
</style>
</head>
<body>

<section class="hero">
    <div class="container">
        <h1>Apply at MSukasha</h1>
        <p>
            Join Pakistan's growing B2B & C2C marketplace and help shape
            the future of digital trade.
        </p>
    </div>
</section>

<div class="container">
    <div class="application-card">

        <div class="role-box">
            <strong>Position Applied For:</strong>
            <span id="jobRole">Open Application</span>
        </div>

        <form id="applicationForm">

            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" required>
            </div>

            <div class="form-group">
                <label>CNIC *</label>
                <input type="text" placeholder="Enter your CNIC" required>
                <input type="file" accept=".jpg,.jpeg,.png,.pdf" style="margin-top:8px;" required>
            </div>

            <div class="form-group">
                <label>Business Name (if applicable)</label>
                <input type="text">
            </div>

             <div class="form-group">
                <label>Current Location (City, Country) *</label>
                <input type="text" required>
            </div>

            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" required>
            </div>

            <div class="form-group">
                <label>Phone Number *</label>
                <input type="tel" required>
            </div>

            <div class="form-group">
                <label>City *</label>
                <input type="text" required>
            </div>
           
            <div class="form-group">
                <label>Education *</label>
                <input type="text"
                placeholder="Bachelor's, Master's, Intermediate etc."
                required>
            </div>

            <div class="form-group">
                <label>Years of Experience *</label>
                <select required>
                    <option value="">Select Experience</option>
                    <option>0-1 Years</option>
                    <option>1-3 Years</option>
                    <option>3-5 Years</option>
                    <option>5+ Years</option>
                </select>
            </div>

            <div class="form-group">
                <label>Preferred Role Type *</label>
                <select required>
                    <option value="">Select Role Type</option>
                    <option>Product Management</option>
                    <option>Engineering</option>
                    <option>Design</option>
                    <option>Marketing</option>
                    <option>Operations</option>
                    <option>Customer Support</option>
                    <option>Other</option>
                </select>

            </div>

            <div class="form-group">
                <label>Resume / CV *</label>
                <input type="file" accept=".pdf,.doc,.docx" required>
            </div>

            <div class="form-group">
                <label>Document</label>
                <input type="file" accept=".pdf,.jpg,.jpeg,.png">
            </div>

            <div class="form-group">  
                 <label>LinkedIn Profile(Optional)</label>
                 <input type="url" placeholder="https://linkedin.com/in/your-profile">
            </div>

            <div class="form-group">
                <label>Why do you want to join MSukasha?</label>
                <textarea placeholder="Tell us about yourself, your skills, and why you'd be a great fit."></textarea>
            </div>

            <button type="submit" class="btn">
                <i class="fas fa-paper-plane"></i>
                Submit Application
            </button>

        </form>

        <div class="success-message" id="successMessage">
            <i class="fas fa-check-circle"></i>
            Thank you for applying. Your application has been received successfully.
        </div>

    </div>
</div>

<footer>
    © 2026 MSukasha. All Rights Reserved.
</footer>

<script>
const params = new URLSearchParams(window.location.search);

const role =
    params.get("role") ||
    "Open Application";

document.getElementById("jobRole").textContent = role;

document
.getElementById("applicationForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    document.getElementById("successMessage").style.display = "block";

    this.reset();

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
});
const fileInput = document.querySelector('input[type="file"]');

fileInput.addEventListener('change', function () {
    const file = this.files[0];

    if (file && file.size > 5 * 1024 * 1024) {
        alert('CV must be less than 5MB');
        this.value = '';
    }
});
</script>

</body>
</html>
